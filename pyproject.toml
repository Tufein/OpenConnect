[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "openconnect"
version = "0.26.0"
description = "Open-source, self-hosted alternative to Garmin Connect, built on the Garmin Connect Developer API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "OpenConnect contributors" }]
keywords = ["garmin", "fitness", "fit", "gpx", "tcx", "self-hosted", "health"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "fitdecode>=0.10",
    "defusedxml>=0.7",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
openconnect = "openconnect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openconnect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:openconnect.*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
