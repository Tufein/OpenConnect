name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Tests
        run: pytest --cov=openconnect --cov-report=term-missing --cov-fail-under=85

  package:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          export OPENCONNECT_DB=/tmp/smoke.db
          /tmp/smoke/bin/openconnect --version
          /tmp/smoke/bin/openconnect sync --days 14
          /tmp/smoke/bin/openconnect serve --port 8123 &
          sleep 4
          curl -fsS http://127.0.0.1:8123/healthz
          # Save responses first: `grep -q` in a pipe closes early and curl then
          # fails with SIGPIPE under `pipefail`.
          curl -fsS http://127.0.0.1:8123/ -o /tmp/page.html
          grep -q "OpenConnect" /tmp/page.html
          curl -fsS http://127.0.0.1:8123/static/openconnect.css -o /tmp/openconnect.css
          grep -q "phosphor" /tmp/openconnect.css
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t openconnect:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --name oc -p 8124:8000 openconnect:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8124/healthz && exit 0
            sleep 1
          done
          docker logs oc
          exit 1
