name: Release

on:
  # Pushing a tag publishes a release. Running the workflow by hand on main
  # does the same and creates the tag at that commit.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (must equal v<version> in pyproject.toml and versionName in android/app/build.gradle.kts)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The APK is built first so a release is only created when both the Python
  # package and the Android app built and passed their tests.
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Only release from main when started by hand
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "Manual releases must run on main (this run is on ${GITHUB_REF_NAME})."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # Same cache as the Android workflow: these tests fetch Robolectric's Android runtime from Maven Central,
      # and a failed download would fail the whole release.
      - name: Cache Robolectric's Android runtime
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-
      - name: Verify the tag matches the app version
        run: |
          grep -q "versionName = \"${TAG#v}\"" android/app/build.gradle.kts || {
            echo "Tag ${TAG} does not match versionName in android/app/build.gradle.kts"; exit 1; }
      - name: Get the release signing key
        # The key is not in the repository. It comes from GitHub secrets when they exist, otherwise from a
        # private draft release that the first release creates (see android/scripts/signing-key.sh).
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCONNECT_KEYSTORE_BASE64: ${{ secrets.OPENCONNECT_KEYSTORE_BASE64 }}
          OPENCONNECT_KEYSTORE_PASSWORD: ${{ secrets.OPENCONNECT_KEYSTORE_PASSWORD }}
        run: bash android/scripts/signing-key.sh "${RUNNER_TEMP}/signing"
      - name: Test and build the signed APK
        working-directory: android
        run: ./gradlew :core:test :app:testGithubDebugUnitTest :app:assembleGithubRelease --console=plain
      - name: Check the APK is signed with the release key
        run: |
          bash android/scripts/verify-apk-signer.sh android/app/build/outputs/apk/github/release/app-github-release.apk \
            "$OPENCONNECT_KEYSTORE" "$OPENCONNECT_KEY_ALIAS" "$OPENCONNECT_KEYSTORE_PASSWORD"
      - name: Keep the APK small
        # The budget (13 MiB) lives in android/scripts/check_apk_size.py, which the Android workflow runs on every change
        # too. It was 30 MB before R8 shrinking (v0.58.0) and is 12.56 MB at v1.13.0, nearly all of it code.
        run: |
          python3 android/scripts/check_apk_size.py android/app/build/outputs/apk/github/release/app-github-release.apk \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Name the APK and write its checksum
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/github/release/app-github-release.apk "apk/openconnect-${TAG}.apk"
          (cd apk && sha256sum "openconnect-${TAG}.apk" > "openconnect-${TAG}.apk.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: apk/

  # The signed APK is started on a real Android (an emulator) and walked through before anything is published, because the
  # APK is shrunk and the JVM tests cannot see what shrinking breaks (android/scripts/emulator_smoke.py). This is a gate:
  # the release job waits for it. The only allowance is one more walk on a fresh emulator when the first walk failed,
  # because the GitHub runner can lose its emulator (the script then exits with status 3 and says so); a crash of the app
  # fails both walks.
  smoke:
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk the signed APK on an emulator
        id: walk
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          script: python3 android/scripts/emulator_smoke.py apk/openconnect-${{ inputs.tag || github.ref_name }}.apk smoke-out
      - name: Walk the signed APK again on a fresh emulator
        if: steps.walk.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 2048
          script: python3 android/scripts/emulator_smoke.py apk/openconnect-${{ inputs.tag || github.ref_name }}.apk smoke-out-retry
      - name: Keep the screenshots and the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke
          path: |
            smoke-out/
            smoke-out-retry/
          if-no-files-found: ignore

  release:
    runs-on: ubuntu-latest
    needs: [android, smoke]
    steps:
      - name: Only release from main when started by hand
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "Manual releases must run on main (this run is on ${GITHUB_REF_NAME})."
          exit 1
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        run: |
          # 1.0.0-rc.1 (the tag and the app) and 1.0.0rc1 (Python) are the same version in two spellings, so compare them as versions.
          pip install packaging
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          tag = os.environ["TAG"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if not tag.startswith("v") or Version(tag[1:]) != Version(version):
              raise SystemExit(f"Tag {tag} does not match the package version {version}")
          PY
      - name: Run the test suite
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/download-artifact@v8
        with:
          name: apk
          path: apk
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          # A release candidate (1.0.0-rc.1) is published as a GitHub pre-release: it is not "latest", so the in-app updater,
          # which asks for the latest full release, never offers it.
          flags=""
          case "${TAG}" in *-*) flags="--prerelease" ;; esac
          if [ -f "$notes" ]; then
            # A fixed front matter (install, check, what is tested) above the notes, so a stranger needs no README.
            sed "s/@TAG@/${TAG}/g" .github/release-header.md > "${RUNNER_TEMP}/notes.md"
            cat "$notes" >> "${RUNNER_TEMP}/notes.md"
            gh release create "$TAG" dist/* apk/* --target "$GITHUB_SHA" --title "OpenConnect ${TAG}" $flags --notes-file "${RUNNER_TEMP}/notes.md"
          else
            gh release create "$TAG" dist/* apk/* --target "$GITHUB_SHA" --title "OpenConnect ${TAG}" $flags --generate-notes
          fi
