name: Release

on:
  # Pushing a tag publishes a release. Running the workflow by hand on main
  # does the same and creates the tag at that commit.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (must equal v<version> in pyproject.toml)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Only release from main when started by hand
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "Manual releases must run on main (this run is on ${GITHUB_REF_NAME})."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${TAG}" || { echo "Tag ${TAG} does not match version v${version}"; exit 1; }
      - name: Run the test suite
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "OpenConnect ${TAG}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "OpenConnect ${TAG}" --generate-notes
          fi
