name: Release

on:
  # Pushing a tag publishes a release. Running the workflow by hand on main
  # does the same and creates the tag at that commit.
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (must equal v<version> in pyproject.toml and versionName in android/app/build.gradle.kts)"
        required: true
        default: "v0.6.0"

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The APK is built first so a release is only created when both the Python
  # package and the Android app built and passed their tests.
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Only release from main when started by hand
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "Manual releases must run on main (this run is on ${GITHUB_REF_NAME})."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify the tag matches the app version
        run: |
          grep -q "versionName = \"${TAG#v}\"" android/app/build.gradle.kts || {
            echo "Tag ${TAG} does not match versionName in android/app/build.gradle.kts"; exit 1; }
      - name: Get the release signing key
        # The key is not in the repository. It comes from GitHub secrets when they exist, otherwise from a
        # private draft release that the first release creates (see android/scripts/signing-key.sh).
        env:
          GH_TOKEN: ${{ github.token }}
          OPENCONNECT_KEYSTORE_BASE64: ${{ secrets.OPENCONNECT_KEYSTORE_BASE64 }}
          OPENCONNECT_KEYSTORE_PASSWORD: ${{ secrets.OPENCONNECT_KEYSTORE_PASSWORD }}
        run: bash android/scripts/signing-key.sh "${RUNNER_TEMP}/signing"
      - name: Test and build the signed APK
        working-directory: android
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleRelease --console=plain
      - name: Check the APK is signed with the release key
        run: |
          bash android/scripts/verify-apk-signer.sh android/app/build/outputs/apk/release/app-release.apk \
            "$OPENCONNECT_KEYSTORE" "$OPENCONNECT_KEY_ALIAS" "$OPENCONNECT_KEYSTORE_PASSWORD"
      - name: Name the APK and write its checksum
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk "apk/openconnect-${TAG}.apk"
          (cd apk && sha256sum "openconnect-${TAG}.apk" > "openconnect-${TAG}.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apk/

  release:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Only release from main when started by hand
        if: github.event_name == 'workflow_dispatch' && github.ref_name != 'main'
        run: |
          echo "Manual releases must run on main (this run is on ${GITHUB_REF_NAME})."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the tag matches the package version
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${TAG}" || { echo "Tag ${TAG} does not match version v${version}"; exit 1; }
      - name: Run the test suite
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Build
        run: |
          pip install build
          python -m build
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: apk
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" dist/* apk/* --target "$GITHUB_SHA" --title "OpenConnect ${TAG}" --notes-file "$notes"
          else
            gh release create "$TAG" dist/* apk/* --target "$GITHUB_SHA" --title "OpenConnect ${TAG}" --generate-notes
          fi
