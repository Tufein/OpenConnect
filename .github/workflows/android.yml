name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test --console=plain
      - name: App tests (includes UI smoke tests that write screenshots)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Check the APK signature
        run: |
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: openconnect-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: android/app/build/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore
