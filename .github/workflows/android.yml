name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric downloads its Android runtime jars from Maven Central the first time it runs. Caching them
      # stops one flaky download from failing every UI test ("Failed to fetch maven artifact
      # org.robolectric:android-all-instrumented:...").
      - name: Cache Robolectric's Android runtime
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-
      - name: Core tests
        run: ./gradlew :core:test --console=plain
      - name: App tests (GitHub and store channels, includes UI smoke tests that write screenshots)
        run: ./gradlew :app:testGithubDebugUnitTest :app:testStoreDebugUnitTest --console=plain
      - name: Lint (GitHub and store channels)
        run: ./gradlew :app:lintGithubDebug :app:lintStoreDebug --console=plain
      - name: Build the release APKs (GitHub and store)
        run: ./gradlew :app:assembleGithubRelease :app:assembleStoreRelease --console=plain
      # Pull-request builds have no release key, so these APKs are signed with the throw-away Android debug
      # key: fine for trying them out, not for handing them to anyone. Releases are signed in release.yml.
      # The GitHub channel is the one the updater and the release job use; check its signature explicitly.
      - name: Check the GitHub APK signature
        run: |
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs app/build/outputs/apk/github/release/app-github-release.apk
      # The release workflow fails above the same budget, so a change that makes the APK too big is found here, not at release time.
      - name: Check the size of the GitHub APK
        run: python3 scripts/check_apk_size.py app/build/outputs/apk/github/release/app-github-release.apk --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: openconnect-apk-debug-signed-github
          path: android/app/build/outputs/apk/github/release/app-github-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: openconnect-apk-debug-signed-store
          path: android/app/build/outputs/apk/store/release/app-store-release.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: android/app/build/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore
