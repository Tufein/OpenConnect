name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric downloads its Android runtime jars from Maven Central the first time it runs. Caching them
      # stops one flaky download from failing every UI test ("Failed to fetch maven artifact
      # org.robolectric:android-all-instrumented:...").
      - name: Cache Robolectric's Android runtime
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: |
            robolectric-${{ runner.os }}-
      - name: Core tests
        run: ./gradlew :core:test --console=plain
      - name: App tests (includes UI smoke tests that write screenshots)
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --console=plain
      # Pull-request builds have no release key, so this APK is signed with the throw-away Android debug
      # key: fine for trying it out, not for handing to anyone. Releases are signed in release.yml.
      - name: Check the APK signature
        run: |
          "${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner" \
            verify --print-certs app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        with:
          name: openconnect-apk-debug-signed
          path: android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: android/app/build/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: |
            android/app/build/reports/
            android/core/build/reports/
          if-no-files-found: ignore
