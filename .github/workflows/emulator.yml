name: Emulator smoke

# Starts the release APK on a real Android (an emulator) and walks the app: first start, demo data, every tab, a key saved
# through the Keystore and read back after a restart (android/scripts/emulator_smoke.py). The JVM tests cannot see a crash
# that only happens in the shrunk APK or on the real Android runtime. It runs the shrunk and the plain APK of both channels
# (github, with the updater, and store, without it), so a failure that only shows in one flavor or with R8 points at the cause.
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/emulator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        minify: ["true", "false"]
        channel:
          - flavor: github
            task: assembleGithubRelease
          - flavor: store
            task: assembleStoreRelease
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      # Each matrix job has its own fresh runner and emulator, so no flavor can inherit an install from another one.
      - name: Build the release APK (${{ matrix.channel.flavor }}, minify=${{ matrix.minify }})
        working-directory: android
        run: ./gradlew :app:${{ matrix.channel.task }} -Popenconnect.minify=${{ matrix.minify }} --console=plain
      - name: Size of the APK
        run: |
          apk="android/app/build/outputs/apk/${{ matrix.channel.flavor }}/release/app-${{ matrix.channel.flavor }}-release.apk"
          ls -l "$apk"
          echo "${{ matrix.channel.flavor }} minify=${{ matrix.minify }}: $(du -h "$apk" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Walk the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: python3 android/scripts/emulator_smoke.py android/app/build/outputs/apk/${{ matrix.channel.flavor }}/release/app-${{ matrix.channel.flavor }}-release.apk smoke-out-${{ matrix.channel.flavor }}-minify-${{ matrix.minify }}
      - name: Keep the screenshots and the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-smoke-${{ matrix.channel.flavor }}-minify-${{ matrix.minify }}
          path: smoke-out-${{ matrix.channel.flavor }}-minify-${{ matrix.minify }}/
          if-no-files-found: ignore
